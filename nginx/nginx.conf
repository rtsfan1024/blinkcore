worker_processes 1;
events {
    worker_connections 512;
    multi_accept on;
    use epoll;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=search:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=leads:10m  rate=15r/m;

    # Logs
    log_format main  '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /data/nginx/logs/access.log main;

    # Upstream: Rust API backend
    upstream blinkcore_api {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    }

    # Upstream: Next.js SSR
    upstream blinkcore_next {
        server 127.0.0.1:3000;
    }

    # ========== your-domain.com - BlinkCore Blog ==========
    server {
        listen 443 ssl http2;
        server_name your-domain.com www.your-domain.com;

        ssl_certificate     /etc/nginx/your-domain.com.pem;
        ssl_certificate_key /etc/nginx/your-domain.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;


        # CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://huggingface.co; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://b3logfile.com https://your-oss-bucket.oss-cn-hangzhou.aliyuncs.com;" always;
        # Next.js SSR proxy
        location / {
            proxy_pass http://blinkcore_next;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Static assets - Nginx serves directly
        location /_next/static {
            alias /opt/blinkcore/frontend/.next/static;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /static {
            alias /opt/blinkcore/frontend/.next/static;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public API - no mTLS
        location /api/v1/public/search {
            limit_req zone=search burst=5 nodelay;
            proxy_pass http://blinkcore_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_read_timeout 30s;
        }
        location /api/v1/public/leads {
            limit_req zone=leads burst=5 nodelay;
            proxy_pass http://blinkcore_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_read_timeout 30s;
        }
        location /api/v1/public/articles {
            proxy_pass http://blinkcore_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_read_timeout 30s;
        }


        # Admin API - Sync with API Key (for Obsidian plugin / pipeline cli)
        location /api/v1/admin/sync {
            if ($http_x_api_key != "YOUR_API_KEY_HERE") {
                return 403;
            }
            proxy_pass http://blinkcore_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Verify "SUCCESS";
            proxy_read_timeout 60s;
        }
        # Admin API - API Key required
        location /api/v1/admin/ {
            if ($http_x_api_key != "YOUR_API_KEY_HERE") {
                return 403;
            }
            proxy_pass http://blinkcore_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Verify "SUCCESS";
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass http://blinkcore_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ACME challenge
        location ^~ /.well-known/acme-challenge/ {
            root /opt/blinkcore/frontend/public;
        }

        # Deny dotfiles
        location ~ /\. { deny all; access_log off; log_not_found off; }
    }

    # your-domain.com HTTP → HTTPS
    server {
        listen 80;
        server_name your-domain.com www.your-domain.com;
        return 301 https://$host$request_uri;
    }

    # ========== your-other-domain.com - IntelliEngine Static Site ==========
    server {
        listen 443 ssl http2;
        server_name your-other-domain.com www.your-other-domain.com;

        ssl_certificate     /etc/nginx/your-other-domain.com.pem;
        ssl_certificate_key /etc/nginx/your-other-domain.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        root /data/nginx/www/intelliengine;
        index index.html;

        location / { try_files $uri $uri/ /index.html; }

        access_log /data/nginx/logs/your-other-website.log main;
        error_log  /data/nginx/logs/your-other-website-error.log;
    }

    # your-other-domain.com HTTP → HTTPS
    server {
        listen 80;
        server_name your-other-domain.com www.your-other-domain.com;
        return 301 https://$host$request_uri;
    }
}
